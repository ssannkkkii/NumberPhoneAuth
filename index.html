<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone OTP Auth</title>
</head>
<body>
  <h2>Авторизація через номер телефону</h2>
  <input type="text" id="phone" placeholder="Введіть номер телефону">
  <button onclick="sendOTP()">Надіслати OTP</button>

  <br><br>
  <input type="text" id="otp" placeholder="Введіть OTP">
  <button onclick="verifyOTP()">Підтвердити OTP</button>

  <br><br>
  <button onclick="getProfile()">Отримати профіль</button>

  <pre id="output"></pre>

  <script>
    const BASE_URL = 'http://127.0.0.1:8000';
    let accessToken = '';
  
    async function sendOTP() {
      const phone = document.getElementById('phone').value;
      const res = await fetch(`${BASE_URL}/api/send-otp/`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ phone_number: phone })
      });
      const data = await res.json();
      document.getElementById('output').textContent = JSON.stringify(data, null, 2);
    }
  
    async function verifyOTP() {
      const phone = document.getElementById('phone').value;
      const otp = document.getElementById('otp').value;
      const res = await fetch(`${BASE_URL}/api/verify-otp/`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ phone_number: phone, otp: otp })
      });
      const data = await res.json();
      accessToken = data.access;
      document.getElementById('output').textContent = JSON.stringify(data, null, 2);
    }
  
    async function getProfile() {
      const res = await fetch(`${BASE_URL}/api/profile/`, {
        headers: { 'Authorization': 'Bearer ' + accessToken }
      });
      const data = await res.json();
      document.getElementById('output').textContent = JSON.stringify(data, null, 2);
    }
  </script>
  
</body>
</html>
